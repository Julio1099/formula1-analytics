services:
  db:
    image: postgres:13
    container_name: f1_postgres_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: f1user
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: f1database
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../Data Layer/silver/models:/docker-entrypoint-initdb.d

  spark-etl:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    container_name: f1_etl_job
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: f1user
      DB_PASSWORD: "1234"
      DB_NAME: f1database
      DB_PORT: 5432
    volumes:
      - ../Data Layer/raw/dados_originais:/home/jovyan/work/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: f1_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@admin.com"
      PGADMIN_DEFAULT_PASSWORD: "admin"
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata: